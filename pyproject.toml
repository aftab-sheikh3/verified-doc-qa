[project]
name = "verified-doc-qa"
version = "0.1.0"
description = "Agentic RAG that checks whether your documents can answer, cites its sources and verifies every answer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.0",
    "qdrant-client>=1.12",
    "pypdf>=5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
rerank = ["sentence-transformers>=3.0"]
docling = ["docling>=2.0"]
ui = ["streamlit>=1.40", "requests>=2.31"]
tracing = ["langfuse>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.17"]

[project.scripts]
docqa = "verified_doc_qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
